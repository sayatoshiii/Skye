[package]
name = "skye"
version = "0.1.0"
description = "Matrix client"
authors = ["Sayatoshi Yumeko"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"


[lib]
name = "skye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
livekit = { version = "0.11", features = ["rustls-tls-native-roots"] }
cpal = { version = "0.18", features = ["pipewire"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
nnnoiseless = "0.5"
futures-util = "0.3"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
pipewire = "0.10"
jpeg-encoder = { version = "0.7", features = ["simd"] }
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rdev = "0.5"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
wasapi = "0.27"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
