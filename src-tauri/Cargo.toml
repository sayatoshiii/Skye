[package]
name = "skye"
version = "0.1.0"
description = "Matrix client"
authors = ["Sayatoshi Yumeko"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"


[lib]
name = "skye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = "3.0.0-alpha.7"
pipewire = "0.10"
gstreamer = "0.25"
zbus = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
futures-util = "0.3"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rdev = "0.5"
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-dialog = { version = "3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-single-instance = "3.0.0-alpha.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-runtime-wry = "3.0.0-alpha.6"

[target."cfg(windows)".dependencies]
wasapi = "0.27"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"

[patch.crates-io]
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }
