[package]
edition = "2024"
rust-version = "1.95"
name = "tauri-bundler"
version = "3.0.0-alpha.5"
authors = [
    "George Burton <burtonageo@gmail.com>",
    "Tauri Programme within The Commons Conservancy",
]
build = false
exclude = [
    "CHANGELOG.md",
    "/target",
    "rustfmt.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
