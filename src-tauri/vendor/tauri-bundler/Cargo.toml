description = "Wrap rust executables in OS-specific app bundles for Tauri"
readme = "README.md"
keywords = [
    "bundle",
    "cargo",
    "tauri",
]
categories = [
    "command-line-utilities",
    "development-tools::cargo-plugins",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/tauri"

[features]
